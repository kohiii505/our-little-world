<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Little World</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- INTRO SCREEN -->
    <div id="intro">
        <div class="intro-content">
            <p class="small-text">A little place I made for you.</p>

            <h1>Our Little World</h1>

            <button onclick="enterWorld()">
                ENTER
            </button>
        </div>
    </div>


    <!-- THE WORLD -->
    <main id="world">

        <!-- STARS -->
        <div class="stars"></div>

        <!-- MOON -->
        <div class="moon"></div>

        <!-- CENTRAL LIGHT -->
        <div class="center-light">
            <div class="glow"></div>
            <div class="little-star">✦</div>
        </div>


        <!-- HOME -->
        <button class="world-place home"
                onclick="openPlace('home')">

            <span class="icon">⌂</span>

            <span class="place-name">
                HOME
            </span>

        </button>


        <!-- FOREST -->
        <button class="world-place forest"
                onclick="openPlace('forest')">

            <span class="icon">♣</span>

            <span class="place-name">
                THE FOREST
            </span>

        </button>


        <!-- OCEAN -->
        <button class="world-place ocean"
                onclick="openPlace('ocean')">

            <span class="icon">≈</span>

            <span class="place-name">
                THE OCEAN
            </span>

        </button>


        <!-- OBSERVATORY -->
        <button class="world-place observatory"
                onclick="openPlace('observatory')">

            <span class="icon">✦</span>

            <span class="place-name">
                OBSERVATORY
            </span>

        </button>


        <!-- FUTURE -->
        <button class="world-place future"
                onclick="openPlace('future')">

            <span class="icon">◇</span>

            <span class="place-name">
                ?
            </span>

        </button>


        <!-- LITTLE MESSAGE -->
        <div class="world-message">
            <p>There are places here<br>
            that only exist because of us.</p>
        </div>

    </main>
<!-- HOME ROOM -->
<div id="home-room">

    <button class="back-button" onclick="closeHome()">
        ← BACK
    </button>

    <div class="room-window">
        <div class="window-sky"></div>
    </div>

    <div class="room-bed">
        <div class="pillow"></div>
        <div class="blanket"></div>
    </div>

    <div class="room-lamp">
        ✦
    </div>

    <div class="room-books">
        📚
    </div>

</div>

    <!-- PLACE POPUP -->
    <div id="popup">

        <div class="popup-box">

            <button class="close"
                    onclick="closePlace()">
                ×
            </button>

            <h2 id="popup-title">
                PLACE
            </h2>

            <p id="popup-text">
                Something will appear here.
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
